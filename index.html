<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recall — MCQ Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080d18;
    --bg-2:#0c1424;
    --panel:#0f1a2e;
    --panel-2:#132140;
    --border:#1e2c4a;
    --border-soft:#182238;
    --text:#e8edf7;
    --text-dim:#8b9bbd;
    --text-dimmer:#5c6b8a;
    --accent:#2fd9c4;
    --accent-dim:rgba(47,217,196,.12);
    --accent-soft:rgba(47,217,196,.35);
    --green:#3ddc97;
    --green-dim:rgba(61,220,151,.12);
    --red:#ff6b6b;
    --red-dim:rgba(255,107,107,.12);
    --amber:#f5b942;
    --amber-dim:rgba(245,185,66,.14);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(47,217,196,.06), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(90,110,220,.07), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  .disp{font-family:'Space Grotesk',sans-serif;}
  ::selection{background:var(--accent-dim);}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  button{font-family:inherit;}
  a{color:inherit;}

  #app{min-height:100vh;display:flex;flex-direction:column;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 28px;border-bottom:1px solid var(--border-soft);
    background:linear-gradient(180deg, rgba(255,255,255,.02), transparent);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:30px;height:30px;border-radius:8px;
    background:conic-gradient(from 220deg, var(--accent), #5a6edc, var(--accent));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 1px rgba(255,255,255,.06), 0 4px 18px rgba(47,217,196,.25);
  }
  .brand-mark::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--bg);}
  .brand-name{font-family:'Space Grotesk';font-weight:700;font-size:18px;letter-spacing:.2px;}
  .brand-sub{font-size:11px;color:var(--text-dimmer);text-transform:uppercase;letter-spacing:1.5px;margin-top:1px;}
  .pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(61,220,151,.15);flex:none;}
  .pulse-dot.off{background:var(--text-dimmer);box-shadow:0 0 0 3px rgba(92,107,138,.12);}
  .topbar-right{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--text-dim);}

  main{flex:1;display:flex;flex-direction:column;}
  .wrap{max-width:1180px;margin:0 auto;width:100%;padding:28px 24px 60px;}

  .btn{
    appearance:none;border:1px solid var(--border);background:var(--panel-2);
    color:var(--text);padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600;
    cursor:pointer;transition:.15s ease;display:inline-flex;align-items:center;gap:8px;
  }
  .btn:hover{border-color:var(--accent-soft);background:#152341;}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .btn-primary{
    background:linear-gradient(135deg, var(--accent), #22b8a8);
    color:#04211d;border:none;box-shadow:0 6px 20px rgba(47,217,196,.22);font-weight:700;
  }
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-primary:disabled{background:var(--panel-2);color:var(--text-dimmer);box-shadow:none;}
  .btn-ghost{background:transparent;border-color:var(--border-soft);color:var(--text-dim);}
  .btn-ghost:hover{color:var(--text);border-color:var(--border);}
  .btn-sm{padding:6px 12px;font-size:12.5px;border-radius:8px;}

  .pill-row{display:flex;flex-wrap:wrap;gap:8px;}
  .pill{
    border:1px solid var(--border);background:var(--panel-2);color:var(--text-dim);
    padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;
    transition:.12s ease;white-space:nowrap;
  }
  .pill .count{color:var(--text-dimmer);font-weight:500;margin-left:5px;font-family:'JetBrains Mono';font-size:11px;}
  .pill:hover{border-color:var(--accent-soft);color:var(--text);}
  .pill.active{background:var(--accent-dim);border-color:var(--accent-soft);color:var(--accent);}
  .pill.active .count{color:var(--accent);opacity:.75;}
  .pill.status-correct.active{background:var(--green-dim);border-color:rgba(61,220,151,.4);color:var(--green);}
  .pill.status-incorrect.active{background:var(--red-dim);border-color:rgba(255,107,107,.4);color:var(--red);}
  .pill.status-flagged.active{background:var(--amber-dim);border-color:rgba(245,185,66,.4);color:var(--amber);}

  .panel{
    background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);
    padding:22px 24px;
  }
  .panel + .panel{margin-top:18px;}
  .panel h2{
    font-family:'Space Grotesk';font-size:14px;letter-spacing:.4px;text-transform:uppercase;
    color:var(--text-dim);margin:0 0 16px;font-weight:600;
  }
  .grid-2{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;align-items:start;}
  @media (max-width:920px){.grid-2{grid-template-columns:1fr;}}

  .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .mode-card{
    border:1px solid var(--border);background:var(--panel-2);border-radius:12px;padding:16px 16px;
    cursor:pointer;transition:.13s ease;text-align:left;
  }
  .mode-card:hover{border-color:var(--accent-soft);}
  .mode-card.active{background:var(--accent-dim);border-color:var(--accent);}
  .mode-card .m-icon{font-size:19px;margin-bottom:8px;display:block;}
  .mode-card .m-title{font-weight:700;font-size:14.5px;margin-bottom:3px;}
  .mode-card.active .m-title{color:var(--accent);}
  .mode-card .m-desc{font-size:12px;color:var(--text-dimmer);line-height:1.4;}

  .summary-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border-soft);font-size:13.5px;}
  .summary-row:last-of-type{border-bottom:none;}
  .summary-row .label{color:var(--text-dimmer);}
  .summary-row .val{font-weight:600;text-align:right;max-width:60%;}
  .slider-wrap{margin:18px 0 6px;}
  .slider-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:10px;}
  .slider-head .n{font-family:'JetBrains Mono';color:var(--accent);font-weight:700;}
  input[type=range]{
    width:100%;-webkit-appearance:none;height:5px;border-radius:6px;
    background:var(--panel-2);outline:none;border:1px solid var(--border);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:17px;height:17px;border-radius:50%;
    background:var(--accent);cursor:pointer;box-shadow:0 0 0 4px rgba(47,217,196,.18);
  }
  .avail-note{font-size:12px;color:var(--text-dimmer);margin-top:8px;font-family:'JetBrains Mono';}
  .start-btn{width:100%;justify-content:center;padding:13px;font-size:14.5px;margin-top:18px;}

  .quiz-shell{display:grid;grid-template-columns:1fr 230px;gap:20px;align-items:start;}
  @media (max-width:880px){.quiz-shell{grid-template-columns:1fr;}}
  .quiz-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .quiz-header .qtag{font-size:11px;font-weight:700;padding:5px 10px;border-radius:7px;background:var(--accent-dim);color:var(--accent);letter-spacing:.3px;}
  .quiz-progress{font-family:'JetBrains Mono';font-size:12.5px;color:var(--text-dimmer);}
  .timer-chip{font-family:'JetBrains Mono';font-weight:700;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--border);display:flex;align-items:center;gap:7px;}
  .timer-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}
  .timer-chip.low{color:var(--red);border-color:rgba(255,107,107,.4);}
  .timer-chip.low .dot{background:var(--red);}
  .q-card{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);padding:26px 26px 22px;}
  .q-stem{font-size:16.5px;line-height:1.65;margin:0 0 22px;white-space:pre-wrap;}
  .flag-btn{border:1px solid var(--border);background:var(--panel-2);color:var(--text-dimmer);width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:.12s;}
  .flag-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;}
  .flag-btn.on{color:var(--amber);background:var(--amber-dim);border-color:rgba(245,185,66,.4);}
  .flag-btn.on svg{fill:var(--amber);}
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{display:flex;align-items:flex-start;gap:13px;border:1px solid var(--border);background:var(--panel-2);border-radius:11px;padding:13px 15px;cursor:pointer;transition:.12s ease;font-size:14.5px;line-height:1.5;}
  .opt:hover:not(.locked){border-color:var(--accent-soft);background:#142542;}
  .opt .letter{flex:none;width:24px;height:24px;border-radius:7px;background:var(--panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text-dim);font-family:'JetBrains Mono';}
  .opt .otext{flex:1;padding-top:2px;}
  .opt .mark{flex:none;width:18px;height:18px;margin-top:2px;}
  .opt .mark svg{width:18px;height:18px;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
  .opt.correct{border-color:rgba(61,220,151,.5);background:var(--green-dim);}
  .opt.correct .letter{background:var(--green);border-color:var(--green);color:#04241a;}
  .opt.correct .mark svg{stroke:var(--green);}
  .opt.incorrect{border-color:rgba(255,107,107,.5);background:var(--red-dim);}
  .opt.incorrect .letter{background:var(--red);border-color:var(--red);color:#2c0808;}
  .opt.incorrect .mark svg{stroke:var(--red);}
  .opt.locked{cursor:default;}
  .opt.dim{opacity:.55;}
  .explain-box{margin-top:20px;border-radius:14px;padding:20px 22px 22px;font-size:14.5px;line-height:1.7;border:1px solid;border-left-width:4px;white-space:pre-wrap;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.18);}
  .explain-box.ok{background:var(--green-dim);border-color:rgba(61,220,151,.3);border-left-color:var(--green);}
  .explain-box.bad{background:var(--red-dim);border-color:rgba(255,107,107,.3);border-left-color:var(--red);}
  .explain-box .exp-head{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15.5px;margin:0 0 12px;font-family:'Space Grotesk';letter-spacing:.2px;}
  .explain-box .exp-icon{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .explain-box .exp-icon svg{width:15px;height:15px;}
  .explain-box.ok .exp-head{color:var(--green);}
  .explain-box.ok .exp-icon{background:var(--green);color:#04241a;}
  .explain-box.bad .exp-head{color:var(--red);}
  .explain-box.bad .exp-icon{background:var(--red);color:#2c0808;}
  .explain-box .exp-body{color:var(--text-dim);}
  .q-footer{display:flex;justify-content:space-between;align-items:center;margin-top:22px;}

  .side-panel{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);padding:16px;}
  .side-panel h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dimmer);margin:0 0 12px;font-weight:700;}
  .qnav{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-height:420px;overflow-y:auto;padding-right:2px;}
  .qnum{aspect-ratio:1;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);display:flex;align-items:center;justify-content:center;font-size:12px;font-family:'JetBrains Mono';font-weight:600;color:var(--text-dim);cursor:pointer;position:relative;}
  .qnum:hover{border-color:var(--accent-soft);}
  .qnum.current{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
  .qnum.correct{background:var(--green-dim);color:var(--green);border-color:rgba(61,220,151,.4);}
  .qnum.incorrect{background:var(--red-dim);color:var(--red);border-color:rgba(255,107,107,.4);}
  .qnum .fdot{position:absolute;top:-3px;right:-3px;width:7px;height:7px;border-radius:50%;background:var(--amber);}

  .flash-wrap{display:flex;flex-direction:column;align-items:center;padding:10px 0 30px;}
  .flash-card{width:100%;max-width:640px;min-height:320px;border-radius:18px;border:1px solid var(--border-soft);background:var(--panel);padding:36px 34px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;position:relative;}
  .flash-face-label{font-family:'JetBrains Mono';font-size:11px;color:var(--text-dimmer);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:16px;}
  .flash-stem{font-size:18px;line-height:1.6;font-weight:500;}
  .flash-answer{font-size:15px;line-height:1.5;color:var(--green);font-weight:700;margin-bottom:12px;}
  .flash-explain{font-size:13.5px;line-height:1.6;color:var(--text-dim);}
  .flash-hint{margin-top:22px;font-size:12px;color:var(--text-dimmer);text-align:center;}
  .flash-controls{display:flex;gap:10px;margin-top:22px;}

  .score-hero{text-align:center;padding:30px 10px 10px;}
  .score-ring{width:150px;height:150px;border-radius:50%;margin:0 auto 20px;position:relative;display:flex;align-items:center;justify-content:center;}
  .score-ring .num{font-family:'Space Grotesk';font-size:32px;font-weight:700;}
  .score-ring .sub{font-family:'JetBrains Mono';font-size:11px;color:var(--text-dimmer);position:absolute;bottom:38px;}
  .score-stats{display:flex;justify-content:center;gap:26px;margin:18px 0 30px;flex-wrap:wrap;}
  .score-stat{text-align:center;}
  .score-stat .n{font-family:'JetBrains Mono';font-size:22px;font-weight:700;}
  .score-stat.g .n{color:var(--green);}
  .score-stat.r .n{color:var(--red);}
  .score-stat.a .n{color:var(--amber);}
  .score-stat .l{font-size:11px;color:var(--text-dimmer);text-transform:uppercase;letter-spacing:.6px;margin-top:3px;}
  .review-list{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
  .review-item{display:flex;align-items:center;gap:12px;border:1px solid var(--border-soft);background:var(--panel-2);border-radius:10px;padding:11px 14px;cursor:pointer;font-size:13.5px;}
  .review-item:hover{border-color:var(--accent-soft);}
  .review-item .ri-badge{flex:none;width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:'JetBrains Mono';}
  .review-item.wrong .ri-badge{background:var(--red-dim);color:var(--red);}
  .review-item .ri-text{flex:1;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .end-actions{display:flex;gap:10px;justify-content:center;margin-top:26px;flex-wrap:wrap;}
  .empty-note{text-align:center;color:var(--text-dimmer);font-size:13.5px;padding:30px 10px;}
  .hidden{display:none !important;}
  .loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;text-align:center;}
  .loading-screen .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:20px;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API_BASE = 'http://localhost:3000/api';

const state = {
  screen: 'loading',
  library: [],
  sources: {},
  sourceCounts: {},
  qCount: 0,
  selSource: 'ALL',
  selSubjects: new Set(['ALL']),
  statusFilter: 'all',
  mode: 'tutor',
  blockSize: 40,
  progress: {},
  block: [],
  idx: 0,
  revealed: false,
  reviewMode: false,
  timerSec: 0,
  timerHandle: null,
  flashFlipped: false,
};

const TIMED_SECONDS = 90;
const MODES = [
  {id:'tutor', icon:'🎓', title:'Tutor Mode', desc:'See the correct answer and explanation right after each question.'},
  {id:'timed', icon:'⏱️', title:'Timed Mode', desc:'Same as Tutor, with a countdown clock racing each question.'},
  {id:'mock', icon:'📝', title:'Mock Exam', desc:'No feedback until the end — simulates real exam conditions.'},
  {id:'flashcards', icon:'🗂️', title:'Flashcards', desc:'Flip-card revision, no scoring — just quick recall practice.'},
];

function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

function letterFor(i){ return String.fromCharCode(65+i); }

function okIcon(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`; }
function xIcon(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>`; }

function getProgress(id){ return state.progress[id] || null; }

function normalizeQuestion(q) {
  return {
    id: q.id || q._id || Math.random().toString(36).substr(2, 9),
    stem: q.stem || q.question || 'Question text missing',
    options: q.options || [],
    correct_option: typeof q.correct_option === 'number' ? q.correct_option : 0,
    answer: q.answer || (q.options && q.options[q.correct_option]) || '',
    explanation: q.explanation || 'No explanation provided.',
    _source: q._source || 'Unknown',
    _subject: q._subject || 'Untitled'
  };
}

async function fetchData(){
  try {
    const sourcesResp = await fetch(`${API_BASE}/sources`);
    const sourcesData = await sourcesResp.json();
    state.sources = sourcesData.sources;
    
    const statsResp = await fetch(`${API_BASE}/stats`);
    const statsData = await statsResp.json();
    state.qCount = statsData.totalQuestions;
    
    const allCountsResp = await fetch(`${API_BASE}/subject-counts/ALL`);
    const allCounts = await allCountsResp.json();
    state.sourceCounts = { 'ALL': allCounts.counts };
    
    for (const source of Object.keys(state.sources)) {
      const resp = await fetch(`${API_BASE}/subject-counts/${encodeURIComponent(source)}`);
      const data = await resp.json();
      state.sourceCounts[source] = data.counts;
    }
    
    const allQuestionsResp = await fetch(`${API_BASE}/questions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ source: 'ALL', subject: 'ALL', count: 50000, shuffle: false })
    });
    const allData = await allQuestionsResp.json();
    state.library = allData.questions.map(q => normalizeQuestion(q));
    
    return true;
  } catch(e) {
    console.error('Error fetching data:', e);
    alert('Could not connect to API. Make sure the server is running on http://localhost:3000');
    return false;
  }
}

async function fetchQuestions(source, subject, count){
  try {
    const resp = await fetch(`${API_BASE}/questions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ source, subject, count, shuffle: true })
    });
    const data = await resp.json();
    return data.questions || [];
  } catch(e) {
    console.error('Error fetching questions:', e);
    return [];
  }
}

function subjectsForSource(sourceName){
  if(sourceName === 'ALL'){
    const all = new Set();
    Object.values(state.sources).forEach(set => set.forEach(s => all.add(s)));
    return Array.from(all).sort();
  }
  return Array.from(state.sources[sourceName] || []).sort();
}

function matchesStatus(q){
  const p = getProgress(q.id);
  switch(state.statusFilter){
    case 'unused': return !p || !p.status;
    case 'correct': return p && p.status === 'correct';
    case 'incorrect': return p && p.status === 'incorrect';
    case 'flagged': return p && p.flagged;
    default: return true;
  }
}

function filteredQuestions(){
  return state.library.filter(q => {
    if(state.selSource !== 'ALL' && q._source !== state.selSource) return false;
    if(!state.selSubjects.has('ALL') && !state.selSubjects.has(q._subject)) return false;
    if(!matchesStatus(q)) return false;
    return true;
  });
}

function statusCounts(){
  const pool = state.library.filter(q => {
    if(state.selSource !== 'ALL' && q._source !== state.selSource) return false;
    if(!state.selSubjects.has('ALL') && !state.selSubjects.has(q._subject)) return false;
    return true;
  });
  let unused=0, correct=0, incorrect=0, flagged=0;
  pool.forEach(q => {
    const p = getProgress(q.id);
    if(!p || !p.status) unused++;
    if(p && p.status === 'correct') correct++;
    if(p && p.status === 'incorrect') incorrect++;
    if(p && p.flagged) flagged++;
  });
  return {all: pool.length, unused, correct, incorrect, flagged};
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(topbar());
  const main = el('<main></main>');
  main.appendChild(wrap());
  app.appendChild(main);
}

function topbar(){
  const loaded = state.library.length > 0;
  const bar = el(`
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark"></div>
        <div>
          <div class="brand-name">Recall</div>
          <div class="brand-sub">MCQ Trainer</div>
        </div>
      </div>
      <div class="topbar-right">
        ${loaded ? `<span class="mono">${state.qCount.toLocaleString()} questions</span>` : 'Loading...'}
        <span class="pulse-dot ${loaded ? '' : 'off'}"></span>
      </div>
    </div>
  `);
  return bar;
}

function wrap(){
  const w = el('<div class="wrap"></div>');
  if(state.screen === 'loading') w.appendChild(loadingScreen());
  else if(state.screen === 'config') w.appendChild(configScreen());
  else if(state.screen === 'quiz') w.appendChild(quizScreen());
  else if(state.screen === 'flash') w.appendChild(flashScreen());
  else if(state.screen === 'summary') w.appendChild(summaryScreen());
  return w;
}

function loadingScreen(){
  return el(`
    <div class="loading-screen">
      <div class="spinner"></div>
      <h2 class="disp" style="font-size:22px;margin:0 0 8px;">Loading from API</h2>
      <p style="color:var(--text-dimmer);font-size:14px;">Fetching questions...</p>
    </div>
  `);
}

function configScreen(){
  const counts = statusCounts();
  const wrap = el('<div></div>');

  wrap.appendChild(el(`<div style="margin-bottom:22px;">
    <div class="upload-eyebrow">Select Your Block</div>
    <h1 class="disp" style="font-size:26px;margin:6px 0 4px;">Choose Source & Subject</h1>
    <p style="color:var(--text-dim);font-size:14px;margin:0;">${state.qCount.toLocaleString()} questions across ${Object.keys(state.sources).length} sources</p>
  </div>`));

  const grid = el('<div class="grid-2"></div>');
  const left = el('<div></div>');

  const modePanel = el('<div class="panel"><h2>Study Mode</h2><div class="mode-grid" id="mode-grid"></div></div>');
  const modeGrid = modePanel.querySelector('#mode-grid');
  MODES.forEach(m => {
    const card = el(`
      <button class="mode-card ${state.mode===m.id?'active':''}" data-mode="${m.id}">
        <span class="m-icon">${m.icon}</span>
        <div class="m-title">${m.title}</div>
        <div class="m-desc">${m.desc}</div>
      </button>`);
    card.addEventListener('click', () => { state.mode = m.id; render(); });
    modeGrid.appendChild(card);
  });
  left.appendChild(modePanel);

  const sourcePanel = el('<div class="panel"><h2>Source</h2><div class="pill-row" id="source-row"></div></div>');
  const sourceRow = sourcePanel.querySelector('#source-row');
  
  const allTotal = Object.values(state.sourceCounts['ALL'] || {}).reduce((sum, c) => sum + c, 0);
  sourceRow.appendChild(pillBtn('All Sources', allTotal, state.selSource==='ALL', () => {
    state.selSource = 'ALL'; state.selSubjects = new Set(['ALL']); render();
  }));
  
  Object.keys(state.sources).sort().forEach(src => {
    const counts = state.sourceCounts[src] || {};
    const total = Object.values(counts).reduce((sum, c) => sum + c, 0);
    sourceRow.appendChild(pillBtn(src, total, state.selSource===src, () => {
      state.selSource = src; state.selSubjects = new Set(['ALL']); render();
    }));
  });
  left.appendChild(sourcePanel);

  const subjPanel = el('<div class="panel"><h2>Subject</h2><div class="pill-row" id="subject-row"></div></div>');
  const subjRow = subjPanel.querySelector('#subject-row');
  
  const countsObj = state.sourceCounts[state.selSource] || {};
  const subjList = Object.keys(countsObj).sort();
  const totalSubjQuestions = Object.values(countsObj).reduce((sum, c) => sum + c, 0);
  
  subjRow.appendChild(pillBtn('All Subjects', totalSubjQuestions, state.selSubjects.has('ALL'), () => {
    state.selSubjects = new Set(['ALL']); render();
  }));
  
  subjList.forEach(subj => {
    const cnt = countsObj[subj] || 0;
    const active = !state.selSubjects.has('ALL') && state.selSubjects.has(subj);
    subjRow.appendChild(pillBtn(subj, cnt, active, () => {
      state.selSubjects.delete('ALL');
      if(state.selSubjects.has(subj)) state.selSubjects.delete(subj); else state.selSubjects.add(subj);
      if(state.selSubjects.size === 0) state.selSubjects.add('ALL');
      render();
    }));
  });
  left.appendChild(subjPanel);

  const statusPanel = el('<div class="panel"><h2>Status</h2><div class="pill-row" id="status-row"></div></div>');
  const statusRow = statusPanel.querySelector('#status-row');
  const statusDefs = [
    {id:'all', label:'All', n:counts.all, cls:''},
    {id:'unused', label:'Unused', n:counts.unused, cls:''},
    {id:'correct', label:'Correct', n:counts.correct, cls:'status-correct'},
    {id:'incorrect', label:'Incorrect', n:counts.incorrect, cls:'status-incorrect'},
    {id:'flagged', label:'Flagged', n:counts.flagged, cls:'status-flagged'},
  ];
  statusDefs.forEach(s => {
    const b = el(`<button class="pill ${s.cls} ${state.statusFilter===s.id?'active':''}">${s.label}<span class="count">${s.n}</span></button>`);
    b.addEventListener('click', () => { state.statusFilter = s.id; render(); });
    statusRow.appendChild(b);
  });
  left.appendChild(statusPanel);

  grid.appendChild(left);

  const filtered = filteredQuestions();
  const maxBlock = Math.max(1, filtered.length);
  if(state.blockSize > filtered.length) state.blockSize = Math.max(1, filtered.length);
  if(state.blockSize < 1) state.blockSize = 1;

  const subjLabel = state.selSubjects.has('ALL') ? 'All Subjects' :
    (state.selSubjects.size===1 ? Array.from(state.selSubjects)[0] : state.selSubjects.size + ' subjects selected');

  const right = el(`
    <div class="panel" style="position:sticky;top:20px;">
      <h2>Block Summary</h2>
      <div class="summary-row"><span class="label">Source</span><span class="val">${esc(state.selSource==='ALL'?'All Sources':state.selSource)}</span></div>
      <div class="summary-row"><span class="label">Subject</span><span class="val">${esc(subjLabel)}</span></div>
      <div class="summary-row"><span class="label">Status</span><span class="val" style="text-transform:capitalize;">${state.statusFilter}</span></div>
      <div class="summary-row"><span class="label">Mode</span><span class="val">${MODES.find(m=>m.id===state.mode).title}</span></div>
      ${state.mode!=='flashcards' ? `
      <div class="slider-wrap">
        <div class="slider-head"><span>Block Size</span><span class="n mono" id="block-size-label">${state.blockSize} Qs</span></div>
        <input type="range" id="block-size" min="1" max="${maxBlock}" value="${state.blockSize}">
      </div>` : ''}
      <div class="avail-note">${filtered.length.toLocaleString()} question${filtered.length===1?'':'s'} available</div>
      <button class="btn btn-primary start-btn" id="start-btn" ${filtered.length===0?'disabled':''}>
        ${state.mode==='flashcards' ? 'Start Flashcards' : 'Start Block'} →
      </button>
    </div>
  `);

  if(state.mode!=='flashcards'){
    const slider = right.querySelector('#block-size');
    const label = right.querySelector('#block-size-label');
    slider.addEventListener('input', () => {
      state.blockSize = parseInt(slider.value,10);
      label.textContent = state.blockSize + ' Qs';
    });
  }
  right.querySelector('#start-btn').addEventListener('click', () => startBlock());

  grid.appendChild(right);
  wrap.appendChild(grid);
  return wrap;
}

function pillBtn(label, count, active, onClick){
  const b = el(`<button class="pill ${active?'active':''}">${esc(label)}<span class="count">${count}</span></button>`);
  b.addEventListener('click', onClick);
  return b;
}

async function startBlock(){
  const filtered = filteredQuestions();
  if(filtered.length === 0) return;

  if(state.mode === 'flashcards'){
    state.block = filtered.slice();
    state.idx = 0;
    state.flashFlipped = false;
    state.screen = 'flash';
    render();
    return;
  }

  const n = Math.min(state.blockSize, filtered.length);
  state.block = filtered.slice(0, n);
  state.idx = 0;
  state.revealed = false;
  state.reviewMode = false;
  state.screen = 'quiz';
  if(state.mode === 'timed') startTimer();
  render();
}

function startTimer(){
  clearInterval(state.timerHandle);
  state.timerSec = TIMED_SECONDS;
  state.timerHandle = setInterval(() => {
    state.timerSec--;
    if(state.timerSec <= 0){
      clearInterval(state.timerHandle);
      if(!state.revealed) revealAnswer(null);
    }
    updateTimerUI();
  }, 1000);
}

function updateTimerUI(){
  const chip = document.getElementById('timer-chip');
  if(!chip) return;
  const m = Math.floor(state.timerSec/60), s = state.timerSec%60;
  chip.querySelector('.tval').textContent = `${m}:${String(s).padStart(2,'0')}`;
  chip.classList.toggle('low', state.timerSec <= 15);
}

function quizScreen(){
  const q = state.block[state.idx];
  const total = state.block.length;
  const isMock = state.mode === 'mock';
  const p = getProgress(q.id);
  const flagged = p && p.flagged;

  const wrap = el('<div></div>');
  const shell = el('<div class="quiz-shell"></div>');
  const left = el('<div></div>');

  const header = el(`
    <div class="quiz-header">
      <span class="qtag">${esc(q._subject)}</span>
      <span class="quiz-progress">Question ${state.idx+1} of ${total}</span>
      ${state.mode==='timed' ? `<div class="timer-chip" id="timer-chip"><span class="dot"></span><span class="tval">--:--</span></div>` : '<span></span>'}
    </div>
  `);
  left.appendChild(header);

  const card = el('<div class="q-card"></div>');
  const stemRow = el(`<div style="display:flex;justify-content:space-between;gap:16px;align-items:flex-start;">
      <div class="q-stem" style="flex:1;">${esc(q.stem)}</div>
    </div>`);
  const flagBtn = el(`<button class="flag-btn ${flagged?'on':''}" title="Flag for review">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V4a1 1 0 0 1 1-1h12l-2.5 5L17 13H5"/></svg>
    </button>`);
  flagBtn.addEventListener('click', () => {
    if(!state.progress[q.id]) state.progress[q.id] = {status:null, flagged:false, selected:null};
    state.progress[q.id].flagged = !state.progress[q.id].flagged;
    render();
  });
  stemRow.appendChild(flagBtn);
  card.appendChild(stemRow);

  const optWrap = el('<div class="options"></div>');
  const reveal = isMock ? state.reviewMode : state.revealed;
  const selIdx = p ? (typeof p.selected === 'number' ? p.selected : null) : null;

  if(q.options && q.options.length > 0){
    q.options.forEach((opt, i) => {
      const isCorrectOpt = i === q.correct_option;
      const wasSelected = selIdx === i;
      let cls = 'opt';
      if(reveal){
        cls += ' locked';
        if(isCorrectOpt) cls += ' correct';
        else if(wasSelected) cls += ' incorrect';
        else cls += ' dim';
      }
      let markHtml = '';
      if(reveal){
        if(isCorrectOpt) markHtml = okIcon();
        else if(wasSelected) markHtml = xIcon();
      }
      const row = el(`<div class="${cls}">
          <span class="letter">${letterFor(i)}</span>
          <span class="otext">${esc(opt)}</span>
          <span class="mark">${markHtml}</span>
        </div>`);
      if(isMock && wasSelected && !reveal){
        row.style.borderColor = 'var(--accent-soft)';
        row.style.background = 'var(--accent-dim)';
      }
      if(!reveal){
        row.addEventListener('click', () => {
          if(isMock) selectMockAnswer(q, i);
          else revealAnswer(i);
        });
      }
      optWrap.appendChild(row);
    });
  } else {
    optWrap.innerHTML = '<div style="color:var(--text-dimmer);padding:10px;">No options available.</div>';
  }
  card.appendChild(optWrap);

  if(reveal){
    const correct = selIdx === q.correct_option;
    const notAnswered = selIdx === null;
    const label = correct ? 'Correct!' : (notAnswered ? (isMock ? 'Not answered' : "Time's up") : 'Incorrect');
    const box = el(`<div class="explain-box ${correct?'ok':'bad'}">
        <div class="exp-head">
          <span class="exp-icon">${correct ? okIcon() : xIcon()}</span>
          ${label}
        </div>
        <div class="exp-body">${esc(q.explanation || 'No explanation provided.')}</div>
      </div>`);
    card.appendChild(box);
  }

  left.appendChild(card);

  const footer = el('<div class="q-footer"></div>');
  const backBtn = el('<button class="btn btn-ghost btn-sm">← End block</button>');
  backBtn.addEventListener('click', () => { clearInterval(state.timerHandle); state.screen='config'; render(); });
  footer.appendChild(backBtn);

  const isLast = state.idx === total-1;
  let nextLabel;
  if(state.reviewMode) nextLabel = isLast ? 'Back to Summary' : 'Next →';
  else if(isLast) nextLabel = isMock ? 'Submit Exam' : 'Finish Block';
  else nextLabel = 'Next Question';
  const canAdvance = state.reviewMode ? true : (isMock ? true : state.revealed);
  const nextBtn = el(`<button class="btn btn-primary" ${canAdvance?'':'disabled'}>${nextLabel} →</button>`);
  nextBtn.addEventListener('click', () => goNext());
  footer.appendChild(nextBtn);
  left.appendChild(footer);

  shell.appendChild(left);
  shell.appendChild(quizSidebar());
  wrap.appendChild(shell);

  if(state.mode === 'timed'){
    setTimeout(updateTimerUI, 0);
  }

  return wrap;
}

function selectMockAnswer(q, i){
  if(!state.progress[q.id]) state.progress[q.id] = {status:null, flagged:false, selected:null};
  state.progress[q.id].selected = i;
  render();
}

function revealAnswer(i){
  const q = state.block[state.idx];
  clearInterval(state.timerHandle);
  state.revealed = true;
  const correct = i === q.correct_option;
  state.progress[q.id] = state.progress[q.id] || {flagged:false};
  state.progress[q.id].status = i===null ? (state.progress[q.id].status||'incorrect') : (correct ? 'correct' : 'incorrect');
  state.progress[q.id].selected = i;
  render();
}

function goNext(){
  const isLast = state.idx === state.block.length - 1;
  if(state.reviewMode){
    if(isLast){ state.screen = 'summary'; render(); return; }
    state.idx++;
    render();
    return;
  }
  if(!isLast){
    state.idx++;
    state.revealed = false;
    if(state.mode === 'timed') startTimer();
    render();
  } else {
    finishBlock();
  }
}

function finishBlock(){
  clearInterval(state.timerHandle);
  if(state.mode === 'mock'){
    state.block.forEach(q => {
      const p = state.progress[q.id];
      if(p && p.selected != null){
        p.status = p.selected === q.correct_option ? 'correct' : 'incorrect';
      } else if(p){
        p.status = 'incorrect';
      }
    });
  }
  state.screen = 'summary';
  render();
}

function quizSidebar(){
  const panel = el('<div class="side-panel"><h3>Questions</h3><div class="qnav" id="qnav"></div></div>');
  const nav = panel.querySelector('#qnav');
  state.block.forEach((q, i) => {
    const p = getProgress(q.id);
    let cls = 'qnum';
    if(i === state.idx) cls += ' current';
    if(p && p.status){
      cls += p.status === 'correct' ? ' correct' : ' incorrect';
    }
    const btn = el(`<div class="${cls}">${i+1}${p && p.flagged ? '<span class="fdot"></span>':''}</div>`);
    btn.addEventListener('click', () => {
      clearInterval(state.timerHandle);
      state.idx = i;
      if(state.reviewMode){
        state.revealed = true;
      } else if(state.mode === 'mock'){
        state.revealed = false;
      } else {
        const pp = getProgress(state.block[i].id);
        state.revealed = !!(pp && pp.status);
        if(state.mode === 'timed' && !state.revealed) startTimer();
      }
      render();
    });
    nav.appendChild(btn);
  });
  return panel;
}

function flashScreen(){
  const q = state.block[state.idx];
  const total = state.block.length;
  const wrap = el('<div class="flash-wrap"></div>');

  const header = el(`<div class="quiz-header" style="max-width:640px;width:100%;">
      <span class="qtag">${esc(q._subject)}</span>
      <span class="quiz-progress">Card ${state.idx+1} of ${total}</span>
      <span></span>
    </div>`);
  wrap.appendChild(header);

  const card = el(`<div class="flash-card"></div>`);
  if(!state.flashFlipped){
    card.innerHTML = `
      <div class="flash-face-label">Question</div>
      <div class="flash-stem">${esc(q.stem)}</div>
      <div class="flash-hint">Click card to reveal answer</div>
    `;
  } else {
    card.innerHTML = `
      <div class="flash-face-label">Answer</div>
      <div class="flash-answer">${letterFor(q.correct_option)}. ${esc(q.options[q.correct_option])}</div>
      <div class="flash-explain">${esc(q.explanation || 'No explanation provided.')}</div>
      <div class="flash-hint">Click card to flip back</div>
    `;
  }
  card.addEventListener('click', () => { state.flashFlipped = !state.flashFlipped; render(); });
  wrap.appendChild(card);

  const controls = el('<div class="flash-controls"></div>');
  const backBtn = el('<button class="btn btn-ghost">← End</button>');
  backBtn.addEventListener('click', () => { state.screen='config'; render(); });
  const prevBtn = el(`<button class="btn btn-ghost" ${state.idx===0?'disabled':''}>← Prev</button>`);
  prevBtn.addEventListener('click', () => { state.idx--; state.flashFlipped=false; render(); });
  const nextBtn = el(`<button class="btn btn-primary">${state.idx===total-1?'Finish':'Next →'}</button>`);
  nextBtn.addEventListener('click', () => {
    if(state.idx === total-1){ state.screen='config'; render(); return; }
    state.idx++; state.flashFlipped=false; render();
  });
  controls.appendChild(backBtn); controls.appendChild(prevBtn); controls.appendChild(nextBtn);
  wrap.appendChild(controls);

  return wrap;
}

function summaryScreen(){
  const total = state.block.length;
  let correct=0, incorrect=0, flagged=0;
  state.block.forEach(q => {
    const p = getProgress(q.id);
    if(p && p.status==='correct') correct++;
    if(p && p.status==='incorrect') incorrect++;
    if(p && p.flagged) flagged++;
  });
  const pct = total ? Math.round((correct/total)*100) : 0;
  const ringColor = pct>=70 ? 'var(--green)' : pct>=50 ? 'var(--amber)' : 'var(--red)';

  const wrap = el('<div></div>');
  const hero = el(`
    <div class="score-hero">
      <div class="upload-eyebrow">Block Complete</div>
      <div class="score-ring" style="background:conic-gradient(${ringColor} ${pct*3.6}deg, var(--panel-2) 0deg); box-shadow: inset 0 0 0 10px var(--bg);">
        <span class="sub"></span>
        <span class="num">${pct}%</span>
      </div>
      <div class="score-stats">
        <div class="score-stat g"><div class="n">${correct}</div><div class="l">Correct</div></div>
        <div class="score-stat r"><div class="n">${incorrect}</div><div class="l">Incorrect</div></div>
        <div class="score-stat a"><div class="n">${flagged}</div><div class="l">Flagged</div></div>
      </div>
    </div>
  `);
  wrap.appendChild(hero);

  const wrongOnes = state.block.filter(q => { const p = getProgress(q.id); return p && p.status==='incorrect'; });
  if(wrongOnes.length){
    const panel = el('<div class="panel" style="max-width:640px;margin:0 auto;"><h2>Review Incorrect</h2><div class="review-list" id="review-list"></div></div>');
    const list = panel.querySelector('#review-list');
    wrongOnes.forEach(q => {
      const item = el(`<div class="review-item wrong">
          <span class="ri-badge">✕</span>
          <span class="ri-text">${esc(q.stem)}</span>
        </div>`);
      item.addEventListener('click', () => {
        state.idx = state.block.indexOf(q);
        state.revealed = true;
        state.reviewMode = true;
        state.screen = 'quiz';
        render();
      });
      list.appendChild(item);
    });
    wrap.appendChild(panel);
  }

  const actions = el('<div class="end-actions"></div>');
  const again = el('<button class="btn btn-ghost">Review this block</button>');
  again.addEventListener('click', () => {
    state.idx = 0; state.revealed = true; state.reviewMode = true;
    state.screen='quiz'; render();
  });
  const fresh = el('<button class="btn btn-primary">New Block →</button>');
  fresh.addEventListener('click', () => { state.screen='config'; render(); });
  actions.appendChild(again); actions.appendChild(fresh);
  wrap.appendChild(actions);

  return wrap;
}

async function init(){
  state.screen = 'loading';
  render();
  
  const success = await fetchData();
  if (success) {
    state.screen = 'config';
    render();
  }
}

init();
</script>
</body>
</html>
